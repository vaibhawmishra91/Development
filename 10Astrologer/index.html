<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./as.css">
</head>
<body style="background-color:#0f172a ;display: flex;justify-content: center;align-items: center;">
    <div class="container" style="background-color: aqua">
        <h1>Astrology Insight</h1>
        <form id="astroform">

            <label for="name">First Name</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="surname"> Surname</label>
            <input type="text" id="surname" name="surname" required><br><br>

             <label for="day">DOB(Day):</label>
            <input type="number" id="day" name="day" min="1" max="31" required><br><br>

            <label for="month">Month::</label>
            <input type="number" id="month" name="day" min="1" max="12" required><br><br>
 
            <label for="year">DOB(Day):</label>
            <input type="number" id="year" name="year" min="1900" max="2025" required> <br><br>  

            <input type="submit" value="Get Insight">

        </form>
        <div class="result" id="result"></div>
    </div>

</body>
<script src="./style.js"></script>
</html>
